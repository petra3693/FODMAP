<!doctype html>
<html lang="hu">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E8A3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reizdarm">
<title>Reizdarm Étrend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: zöld "hero" fejléc nagy kalóriagyűrűvel, alatta ráúszó fehér kártyák, alul ikonos fülsor. Elimináció = friss zöld, reintrodukció = borostyán. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --ink:#1A211C; --muted:#6A736C; --line:#E4E8E3; --track:#E3E7E2;
  --hero:#1E8A3A; --hero-2:#177030; --on-hero:#FFFFFF;
  --elim:#1E8A3A; --elim-soft:#E2F3E5; --reint:#C07A12; --reint-soft:#FBEBD2;
  --done:#1E8A3A; --focus:#1F5FA8; --shadow:0 2px 14px rgba(20,40,25,.07);
  --f-display:"DM Serif Display", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1210; --surface:#171D19; --ink:#E7EEE8; --muted:#98A39B; --line:#28302A; --track:#2B342D;
  --hero:#155E29; --hero-2:#0F4A20; --on-hero:#F1FFF3;
  --elim:#4DC46C; --elim-soft:#1B3322; --reint:#E7A74B; --reint-soft:#3A2C16;
  --done:#4DC46C; --focus:#7FB2F0; --shadow:0 2px 14px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1210; --surface:#171D19; --ink:#E7EEE8; --muted:#98A39B; --line:#28302A; --track:#2B342D;
  --hero:#155E29; --hero-2:#0F4A20; --on-hero:#F1FFF3;
  --elim:#4DC46C; --elim-soft:#1B3322; --reint:#E7A74B; --reint-soft:#3A2C16;
  --done:#4DC46C; --focus:#7FB2F0; --shadow:0 2px 14px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.15}
h1{font-family:var(--f-display);font-weight:400;font-size:1.7rem}
h2{font-family:var(--f-display);font-weight:400;font-size:1.55rem}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;font-weight:600;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}
.sec-title{font-family:var(--f-display);font-size:1.55rem;font-weight:400;margin-top:8px}

/* zöld fejléc */
.hero{background:radial-gradient(120% 90% at 85% 0%,rgba(255,255,255,.12),transparent 55%),radial-gradient(90% 70% at 0% 100%,rgba(0,0,0,.12),transparent 60%),var(--hero);color:var(--on-hero);padding-inline:16px;padding-block:14px 70px}
.hero.slim{padding-block:14px 56px}
.hero-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.topbar .brand{font-family:var(--f-display);font-size:1.45rem;line-height:1;white-space:nowrap}
.topbar .r{justify-self:end}
.hbtn{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--on-hero);font-weight:600;cursor:pointer;padding:6px 0}
.hbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hbtn:disabled{opacity:.35;cursor:default}
.ringrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.ringrow .side{text-align:center}
.ringrow .side b{display:block;font-family:var(--f-display);font-weight:400;font-size:2rem;line-height:1.1}
.ringrow .side span{font-size:.85rem;opacity:.85}
.ring{position:relative;width:min(58vw,220px);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .c b{font-family:var(--f-display);font-weight:400;font-size:clamp(2.6rem,11vw,3.6rem);line-height:1}
.ring .c span{font-size:.95rem;opacity:.9}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav .t{text-align:center;font-weight:600}
.daynav .t small{display:block;font-weight:500;opacity:.8}
.hpill{display:inline-block;background:rgba(255,255,255,.18);border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:600}
.lift{margin-top:-52px}

.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.elim{background:var(--elim-soft);color:var(--elim)}
.pill.reint{background:var(--reint-soft);color:var(--reint)}
.pill.plain{background:var(--bg);color:var(--muted);border:1px solid var(--line)}

/* 6 hetes rács */
.grid6{display:grid;grid-template-columns:3.2em repeat(7,1fr);gap:5px;align-items:center}
.grid6 .h{font-size:.7rem;color:var(--muted);text-align:center;font-weight:600}
.grid6 .wl{font-size:.75rem;color:var(--muted);font-weight:600}
.cell{height:36px;border-radius:8px;border:1.5px solid transparent;cursor:pointer;position:relative;
  display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:600;padding:0}
.cell.elim{background:var(--elim-soft);color:var(--elim)}
.cell.reint{background:var(--reint-soft);color:var(--reint)}
.cell.done.elim{background:var(--elim);color:var(--surface)}
.cell.done.reint{background:var(--reint);color:var(--surface)}
.cell.part::after{content:"";position:absolute;left:20%;right:20%;bottom:4px;height:3px;border-radius:2px;background:currentColor;opacity:.6}
.cell.today{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--elim);border-color:var(--elim);color:#fff}
.cell.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--focus)}
.cell .tdot{position:absolute;top:3px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--reint)}
.cell.done .tdot{background:var(--surface)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--done);border-radius:4px}

/* nap nézet */
.dayhead{display:flex;align-items:center;gap:10px}
.dayhead .t{flex:1;min-width:0}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn:disabled{opacity:.35;cursor:default}
.meal{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:0;padding-top:2px}
.meal .lbl{grid-column:2;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.meal input{grid-row:1/span 3;margin-top:18px}
.meal .body{grid-column:2;min-width:0}
.meal.checked .dish{text-decoration:line-through;text-decoration-color:var(--muted);opacity:.7}
.dish{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:600;font-size:1.02rem;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.dish:hover{text-decoration-color:var(--elim)}
.ingline{font-size:.83rem;color:var(--muted);margin-top:2px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--done);cursor:pointer;margin:0}
.test{background:var(--reint-soft);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.test .eyebrow{color:var(--reint)}
.kcal{font-family:var(--f-display);font-size:1.4rem;font-weight:700}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;padding:10px;resize:vertical}
input[type=date],input[type=search]{border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;padding:7px 10px}

/* hét nézet */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:.88rem;white-space:nowrap}

.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.wday{display:grid;grid-template-columns:4.2rem 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.wday:first-child{border-top:0;padding-top:0}
.wday .dn{font-family:var(--f-display);font-weight:400;font-size:1.3rem}
.wday .dn button{background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit;text-align:left}
.wmeals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.wmeals .m{min-width:0}
.wmeals .m .eyebrow{font-size:.65rem}
.wmeals .dish{font-size:.9rem;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.6rem}
.kbar{display:flex;align-items:flex-end;gap:6px;height:84px;padding-top:4px}
.kbar .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.kbar .col span{width:100%;max-width:34px;border-radius:5px 5px 2px 2px;background:var(--elim)}
.kbar.reint .col span{background:var(--reint)}
.kbar .col small{font-size:.68rem;color:var(--muted)}

/* receptek */
.rlist{display:flex;flex-direction:column}
.ritem{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;width:100%}
.ritem:first-child{border-top:0}
.ritem .n{font-weight:600}
.ritem:hover .n{color:var(--elim)}

/* bevásárlás */
.cat{display:flex;flex-direction:column}
.shop{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.shop:first-of-type{border-top:0}
.shop .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.shop .amt small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
.shop.got .nm,.shop.got .amt{opacity:.45;text-decoration:line-through}
.linkbtn{background:none;border:0;padding:0;color:var(--elim);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:600}

/* recept lap */
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,18,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:20px;max-height:84vh}}
.ing{width:100%;border-collapse:collapse}
.ing td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top}
.ing tr:first-child td{border-top:0}
.ing td.q{text-align:right;white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums;padding-left:12px}
ol.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px}
ol.steps li::marker{font-family:var(--f-display);font-weight:700;color:var(--elim)}
.occ{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 6px;cursor:pointer;font-weight:600;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.kbox{background:var(--bg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
#kcalIn{width:6.5em;font-family:var(--f-display);font-size:1.3rem;font-weight:700}
.qin{display:inline-flex;align-items:center;gap:6px}
.qin .u{width:3.2em;text-align:left;color:var(--muted);font-weight:500;font-size:.85rem}
input[type=number]{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;padding:6px 8px;width:5.2em;text-align:right;font-variant-numeric:tabular-nums}
input[type=number].mod{border-color:var(--reint);background:var(--reint-soft)}
.savebar{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));margin-inline:-18px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;z-index:1}
.btn.primary{background:var(--elim);border-color:var(--elim);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}
.warn{color:var(--reint);font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:30}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.burnrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.burnrow:first-child{border-top:0;padding-top:0}
.burnrow .tx{flex:1;min-width:0}
.xbtn{width:30px;height:30px;border-radius:50%;border:0;background:var(--track);cursor:pointer;font-size:1.1rem;line-height:1;color:var(--muted)}
.burnform{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.burnform input[type=text]{flex:1;min-width:140px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;padding:7px 10px}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pgrid label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.9rem}
.pgrid input[type=number]{width:100%}
.pgrid .qin{display:flex}
.seg label{display:block;cursor:pointer}
.seg label input{position:absolute;opacity:0;pointer-events:none}
.seg label span{display:block;text-align:center;border-radius:9px;padding:8px 6px;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg label input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg label input:focus-visible+span{outline:2px solid var(--focus)}
fieldset{border:0;padding:0;margin:0;min-width:0}
.acts{display:flex;flex-direction:column;gap:8px}
.acts legend{margin-bottom:8px}
.act{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.act input{margin-top:3px;accent-color:var(--elim);width:18px;height:18px}
.act:has(input:checked){border-color:var(--elim);background:var(--elim-soft)}
.kbtn{background:none;border:1px solid var(--line);border-radius:999px;padding:2px 9px;cursor:pointer;font-size:.72rem;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0}
.kbtn:hover{border-color:var(--elim);color:var(--elim)}

/* makrók, sorok */
.macros{display:grid;grid-template-columns:1fr 1fr;gap:14px 26px}
.macro .lb{font-size:.92rem;margin-bottom:6px}
.macro .lb b{font-weight:600}
.pbar{height:7px;border-radius:4px;background:var(--track);overflow:hidden}
.pbar>span{display:block;height:100%;border-radius:4px;background:var(--elim)}
.pbar.over>span{background:var(--reint)}
.linkrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;cursor:pointer;color:var(--ink)}
.linkrow svg.i{width:22px;height:22px;stroke:var(--elim);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.linkrow.reint svg.i{stroke:var(--reint)}
.linkrow .tx{flex:1;min-width:0}
.linkrow .chev{color:var(--elim);font-size:1.3rem;line-height:1}
.mealcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:start;cursor:pointer}
.mealcard input{margin-top:3px}
.mealcard .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.mealcard .body{min-width:0}
.mealcard.checked{opacity:.75}
.mealcard.checked .dish{text-decoration:line-through;text-decoration-color:var(--muted)}
.mealcard .kc{text-align:right}
.mealcard .kc b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.35rem;line-height:1.1}

/* fülsor */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);box-shadow:0 -2px 14px rgba(0,0,0,.06);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;color:var(--ink);text-decoration:none;font-size:.7rem;font-weight:500;min-width:0}
nav.tabs a svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--elim)}
ul.tips{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:8px}
.phase{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.phase .sw{width:12px;height:100%;min-height:40px;border-radius:6px}
@media (max-width:420px){.pgrid{grid-template-columns:1fr 1fr}nav.tabs a{font-size:.64rem}nav.tabs a svg{width:24px;height:24px}.ringrow .side b{font-size:1.6rem}.macros{gap:12px 18px}.wday{grid-template-columns:1fr}.wmeals{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr 1fr}.stat b{font-size:1.1rem}}
@media (prefers-reduced-motion:no-preference){.cell,.chip,.btn{transition:background .15s,border-color .15s}}
</style>

function bmr(p){if(!p)return null;return Math.round(10*p.weight+6.25*p.height-5*p.age+(p.sex==="m"?5:-161))}
function baseNeed(p){const b=bmr(p);return b==null?null:Math.round(b*(p.act||1.2))}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const parseD=s=>{const [y,m,dd]=s.split("-").map(Number);return new Date(y,m-1,dd)};
const dateOf=i=>{const x=parseD(S.start);x.setDate(x.getDate()+i);return x};
const fmtDate=x=>x.toLocaleDateString("hu-HU",{month:"short",day:"numeric"});

const dayOf=i=>PLAN[Math.floor(i/7)].days[i%7];
const dk=(i,m)=>`${i}:${m}`;
const dayDone=i=>MEALS.every(([m])=>S.done[dk(i,m)])&&(!dayOf(i).tst||S.done[dk(i,"t")]);
const dayAny=i=>MEALS.some(([m])=>S.done[dk(i,m)])||S.done[dk(i,"t")];
const FR={.25:"¼",.5:"½",.75:"¾"};
function frac(a){const w=Math.floor(a+1e-9),f=Math.round((a-w)*100)/100;if(!f)return String(w);if(FR[f])return (w?w:"")+FR[f];return a.toFixed(1).replace(".",",")}
function fmtQ(a,u){
  if(u==="g")return a>=1000?(a/1000).toFixed(2).replace(/\.?0+$/,"").replace(".",",")+" kg":Math.round(a)+" g";
  if(u==="ml")return a>=1000?(a/1000).toFixed(2).replace(/\.?0+$/,"").replace(".",",")+" l":Math.round(a)+" ml";
  return frac(a)+" "+u;
}
const ingText=([k,a])=>`${fmtQ(a,I[k][1])} ${I[k][0].toLowerCase()}`;

/* mennyiségek és kcal: eredeti recept → saját recept-alap → adott napi módosítás */
const calc=amts=>Math.round(amts.reduce((s,[k,a])=>s+a*(KC[k]||0),0));
function recipeAmounts(id){const e=S.rEdit[id];return R[id].ing.map(([k,a])=>[k,e&&e.ing&&e.ing[k]!=null?e.ing[k]:a])}
function mealEdit(id,mk){const e=mk&&S.mEdit[mk];return e&&e.id===id?e:null}
function mealAmounts(id,mk){const e=mealEdit(id,mk);return recipeAmounts(id).map(([k,a])=>[k,e&&e.ing&&e.ing[k]!=null?e.ing[k]:a])}
function recipeKcal(id){const e=S.rEdit[id];return e&&e.kcal!=null?e.kcal:calc(recipeAmounts(id))}
function mealKcal(id,mk){
  const e=mealEdit(id,mk);if(e&&e.kcal!=null)return e.kcal;
  const c=calc(mealAmounts(id,mk)),r=S.rEdit[id];
  if(r&&r.kcal!=null){const b=calc(recipeAmounts(id));return b?Math.round(r.kcal*c/b):r.kcal}
  return c;
}
const mk=(i,m)=>`${i}:${m}`;
const macros=amts=>amts.reduce((t,[k,a])=>{const m=MC[k]||[0,0,0,0];return t.map((v,x)=>v+a*m[x])},[0,0,0,0]);
function dayKcal(i){const D=dayOf(i);return [...MEALS.map(([m])=>m),"tst"].reduce((s,m)=>D[m]?s+mealKcal(D[m],mk(i,m)):s,0)}
const phaseLbl=ph=>ph==="elim"?"Elimináció":"Reintrodukció";

function weekTotals(wi){
  const tot={};
  PLAN[wi].days.forEach((dy,di)=>["b","l","v","s","tst"].forEach(m=>{const id=dy[m];if(!id)return;mealAmounts(id,mk(wi*7+di,m)).forEach(([k,a])=>tot[k]=(tot[k]||0)+a)}));
  return tot;
}

  const doneKey=m=>dk(i,m==="tst"?"t":m);
  const menu=dayKcal(i),burned=burnOf(i),base=baseNeed(S.profile);
  const goal=(base!=null?base:menu)+burned;
  const eaten=slots.reduce((s,[m])=>S.done[doneKey(m)]?s+mealKcal(D[m],mk(i,m)):s,0);
  const left=goal-eaten;
  const balance=goal-menu;

  const mAll=macros(slots.flatMap(([m])=>mealAmounts(D[m],mk(i,m))));
  const mEat=macros(slots.filter(([m])=>S.done[doneKey(m)]).flatMap(([m])=>mealAmounts(D[m],mk(i,m))));
  const MN=["Fehérje","Zsír","Szénhidrát","Rost"];

  const macroHtml=MN.map((n,x)=>`<div class="macro"><div class="lb">${n}: <b class="num">${f1(mEat[x])}</b><span class="muted num">/${Math.round(mAll[x])} g</span></div><div class="pbar"><span style="width:${mAll[x]?Math.min(100,mEat[x]/mAll[x]*100):0}%"></span></div></div>`).join("");
  const doneDays=Array.from({length:42},(_,k)=>dayDone(k)).filter(Boolean).length;
  let grid=`<div></div>`+DS.map(x=>`<div class="h">${x}</div>`).join("");
  PLAN.forEach((w,wx)=>{grid+=`<div class="wl">${wx+1}. hét</div>`;
    w.days.forEach((dy,dx)=>{const k=wx*7+dx;

const STEP={g:5,ml:10,db:.25,fej:.25,szelet:.5,adag:.25,ek:.5,tk:.5,csipet:1};
const ctxLabel=c=>{const [i,m]=c.split(":");const n=+i;const l=m==="tst"?"Teszt":MEALS.find(x=>x[0]===m)[1];return `${Math.floor(n/7)+1}. hét ${DN[n%7].toLowerCase()} · ${l.toLowerCase()}`};
const same=(a,b)=>Math.abs(a-b)<1e-9;
const numStr=a=>String(Math.round(a*100)/100);
function shRef(){return SH.scope==="day"?recipeAmounts(SH.id):R[SH.id].ing}           // amihez képest "módosított"
function shStored(){return SH.scope==="day"?mealAmounts(SH.id,SH.ctx):recipeAmounts(SH.id)} // ami most el van mentve
function shStoredKcal(){const e=SH.scope==="day"?mealEdit(SH.id,SH.ctx):S.rEdit[SH.id];return e&&e.kcal!=null?e.kcal:null}
function initDraft(){SH.draft={ing:Object.fromEntries(shStored()),kcal:shStoredKcal()}}
const draftAmts=()=>R[SH.id].ing.map(([k])=>[k,SH.draft.ing[k]]);
function draftAuto(){const c=calc(draftAmts());
  if(SH.scope==="day"){const r=S.rEdit[SH.id];if(r&&r.kcal!=null){const b=calc(recipeAmounts(SH.id));return b?Math.round(r.kcal*c/b):r.kcal}}
  return c}
const draftKcal=()=>SH.draft.kcal!=null?SH.draft.kcal:draftAuto();
function dirty(){const st=Object.fromEntries(shStored());
  return R[SH.id].ing.some(([k])=>!same(st[k],SH.draft.ing[k]))||shStoredKcal()!==SH.draft.kcal}
function commit(){
  const ref=Object.fromEntries(shRef()),ing={};
  R[SH.id].ing.forEach(([k])=>{const v=SH.draft.ing[k];if(!same(v,ref[k]))ing[k]=v});
  const has=Object.keys(ing).length||SH.draft.kcal!=null;
  if(SH.scope==="day"){if(has)S.mEdit[SH.ctx]={id:SH.id,ing,kcal:SH.draft.kcal};else delete S.mEdit[SH.ctx]}
  else{if(has)S.rEdit[SH.id]={ing,kcal:SH.draft.kcal};else delete S.rEdit[SH.id]}
  save();render();
}

function openRecipe(id,ctx){SH={id,ctx:ctx||null,scope:ctx?"day":"base"};initDraft();renderSheet();$("#sheet .sheet .iconbtn").focus()}
function renderSheet(){
  const {id,ctx}=SH,r=R[id],occ=OCC[id]||[],ref=Object.fromEntries(shRef()),manual=SH.draft.kcal!=null;
  const sh=$("#sheet");
  sh.innerHTML=`<div class="sheet-bg" data-close><div class="sheet stack" role="dialog" aria-modal="true" aria-labelledby="rt">
    <div class="spread"><span class="pill ${r.t==="t"?"reint":"elim"}">${T[r.t]} · ${r.w}. héttől</span><button class="iconbtn" data-close aria-label="Bezárás">✕</button></div>
    <h2 id="rt">${esc(r.n)}</h2>
    ${ctx?`<div class="seg" role="group" aria-label="Mire vonatkozzon a módosítás">
      <button data-scope="day" aria-pressed="${SH.scope==="day"}">Csak erre a napra</button>
      <button data-scope="base" aria-pressed="${SH.scope==="base"}">Minden napra (alaprecept)</button></div>`:""}
    <p class="small muted">${SH.scope==="day"?`A módosítás csak erre az étkezésre vonatkozik: <b>${ctxLabel(ctx)}</b>.`:"A módosítás minden olyan napra vonatkozik, ahol ez a recept szerepel (kivéve, ahol egy napot külön átírtál)."} Írd át az értékeket, majd nyomd meg a <b>Mentés</b> gombot.</p>
    <div class="kbox">
      <label for="kcalIn" class="eyebrow">Kalória / adag</label>
      <div class="row"><input type="number" id="kcalIn" inputmode="numeric" min="0" step="10" value="${draftKcal()}" class="${manual?"mod":""}"><span>kcal</span>
        <span class="small muted" id="kcalAuto"></span>
        <button class="linkbtn small" data-kauto id="kauto" ${manual?"":"hidden"}>Vissza a számoltra</button></div>
    </div>
    <div><div class="eyebrow" style="margin-bottom:4px">Hozzávalók · 1 adag</div>
      <table class="ing">${R[id].ing.map(([k])=>{const a=SH.draft.ing[k],o=ref[k],u=I[k][1],ch=!same(a,o);
        return `<tr><td><label for="q_${k}">${esc(I[k][0])}</label><div class="small muted" id="o_${k}" ${ch?"":"hidden"}>eredeti: ${fmtQ(o,u)}</div></td>
        <td class="q"><span class="qin"><input type="number" id="q_${k}" data-amt="${k}" inputmode="decimal" min="0" step="${STEP[u]||1}" value="${numStr(a)}" class="${ch?"mod":""}"><span class="u">${u}</span></span></td></tr>`}).join("")}
        ${r.x?`<tr><td>${esc(r.x[0].toUpperCase()+r.x.slice(1))}</td><td class="q muted">ízlés szerint</td></tr>`:""}</table>
      <button class="linkbtn small" data-sreset id="sreset" style="margin-top:10px">Eredeti értékek visszaírása</button></div>
    <div class="savebar"><span class="small" id="dirtyTxt" aria-live="polite"></span>
      <div class="row"><button class="btn" data-cancel id="cancelBtn">Mégse</button><button class="btn primary" data-save id="saveBtn">Mentés</button></div></div>
    <div><div class="eyebrow" style="margin-bottom:6px">Elkészítés</div><ol class="steps">${r.st.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
      ${r.note?`<p class="small muted" style="margin-top:8px">${esc(r.note)}</p>`:""}</div>
    ${occ.length?`<div><div class="eyebrow" style="margin-bottom:6px">A tervben ${occ.length}×</div><div class="occ">${occ.map(o=>`<button class="chip" data-go="${o.i}" data-tabgo="nap">${Math.floor(o.i/7)+1}. hét ${DS[o.i%7]} · ${o.l}</button>`).join("")}</div></div>`:""}
  </div></div>`;
  sh.hidden=false;
  sheetLive();
}
/* élő frissítés gépelés közben (a fókusz marad az inputban) */
function sheetLive(){
  const ref=Object.fromEntries(shRef()),manual=SH.draft.kcal!=null,d=dirty();
  R[SH.id].ing.forEach(([k])=>{const ch=!same(SH.draft.ing[k],ref[k]),inp=document.getElementById("q_"+k),o=document.getElementById("o_"+k);
    if(inp)inp.classList.toggle("mod",ch);if(o)o.hidden=!ch});
  const kin=$("#kcalIn");if(kin){if(!manual&&document.activeElement!==kin)kin.value=draftAuto();kin.classList.toggle("mod",manual)}
  $("#kcalAuto").textContent=manual?`kézzel megadva · számolt: ${draftAuto()} kcal`:"a mennyiségekből számolva";
  $("#kauto").hidden=!manual;
  const anyMod=R[SH.id].ing.some(([k])=>!same(SH.draft.ing[k],ref[k]))||manual;
  $("#sreset").hidden=!anyMod;
  $("#saveBtn").disabled=!d;
  $("#dirtyTxt").textContent=d?"Nem mentett módosítás":"Minden mentve";
  $("#dirtyTxt").className="small "+(d?"warn":"muted");
}
function closeSheet(){const sh=$("#sheet");sh.hidden=true;sh.innerHTML="";SH=null}
let toastT;
function toast(msg){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";t.setAttribute("role","status");document.body.appendChild(t)}
  t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}

/* ---------- Router ---------- */
const VIEWS={nap:vNap,het:vHet,receptek:vReceptek,bevasarlas:vBevasarlas,info:vInfo,profil:vProfil};
function tab(){const h=location.hash.slice(1);return VIEWS[h]?h:"nap"}
function render(keepFocus){
  const t=tab();
  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.tab===t?"page":"false"));
  const ti=todayIdx();
  const HT={het:["Heti bontás","Menü, kalória és haladás hétről hétre"],receptek:["Receptek","Koppints egy receptre a mennyiségek szerkesztéséhez"],bevasarlas:["Bevásárlólista","Hetente, pontos mennyiségekkel"],info:["Tudnivalók","A terv felépítése és a tesztek szabályai"],profil:["Profil","Saját adatok és napi kalóriaszükséglet"]};
  $("#view").innerHTML=t==="nap"?vNap():heroSlim(...HT[t])+`<div class="wrap"><div class="lift">${VIEWS[t]()}</div></div>`;
  if(keepFocus){const el=document.getElementById(keepFocus);if(el){el.focus();const v=el.value;el.value="";el.value=v}}
}
function go(t){if(tab()===t)render();else location.hash=t;window.scrollTo({top:0})}
window.addEventListener("hashchange",()=>{render();window.scrollTo({top:0})});

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-r],[data-scope],[data-kauto],[data-sreset],[data-save],[data-cancel],[data-tabgo2],[data-burndel],[data-go],[data-week],[data-sw],[data-filter],[data-shopweek],[data-shopreset],[data-close]");
  if(!el)return;
  if(el.hasAttribute("data-close")){if(e.target===el||el.classList.contains("iconbtn"))closeSheet();return}
  if(el.dataset.r){e.preventDefault();openRecipe(el.dataset.r,el.dataset.ctx);return}
  if(el.dataset.scope){SH.scope=el.dataset.scope;renderSheet();return}
  if(el.hasAttribute("data-kauto")){SH.draft.kcal=null;renderSheet();return}
  if(el.hasAttribute("data-sreset")){SH.draft={ing:Object.fromEntries(shRef()),kcal:null};renderSheet();return}
  if(el.hasAttribute("data-save")){const sc=SH.scope;commit();closeSheet();toast(sc==="day"?"Mentve erre a napra":"Mentve minden napra");return}
  if(el.hasAttribute("data-cancel")){closeSheet();return}
  if(el.dataset.tabgo2){go(el.dataset.tabgo2);return}
  if(el.dataset.burndel!==undefined){const a=S.burn[UI.sel]||[];a.splice(+el.dataset.burndel,1);if(!a.length)delete S.burn[UI.sel];save();render();return}
  if(el.dataset.go!==undefined){UI.sel=clamp(+el.dataset.go);UI.week=Math.floor(UI.sel/7);closeSheet();if(el.dataset.tabgo)go(el.dataset.tabgo);else render();return}
  if(el.dataset.week!==undefined){UI.week=+el.dataset.week;render();return}
  if(el.dataset.sw!==undefined){UI.shopWeek=+el.dataset.sw;render();return}
  if(el.dataset.filter){UI.filter=el.dataset.filter;render();return}
  if(el.dataset.shopweek!==undefined){UI.shopWeek=+el.dataset.shopweek;go("bevasarlas");return}
  if(el.dataset.shopreset!==undefined){const w=el.dataset.shopreset;Object.keys(S.shop).forEach(k=>{if(k.startsWith(w+":"))delete S.shop[k]});save();render();return}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.chk){if(t.checked)S.done[t.dataset.chk]=1;else delete S.done[t.dataset.chk];save();render();return}
  if(t.dataset.shop){if(t.checked)S.shop[t.dataset.shop]=1;else delete S.shop[t.dataset.shop];save();render();return}
  if(t.id==="startDate"&&t.value){S.start=t.value;S.startSet=1;UI.sel=null;UI.week=null;UI.shopWeek=null;save();render()}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.note!==undefined){if(t.value.trim())S.notes[t.dataset.note]=t.value;else delete S.notes[t.dataset.note];save()}
  if(t.id==="rq"){UI.q=t.value;render("rq")}
  if(SH&&t.dataset.amt){const v=parseFloat(String(t.value).replace(",","."));
    SH.draft.ing[t.dataset.amt]=isNaN(v)||v<0?Object.fromEntries(shRef())[t.dataset.amt]:v;sheetLive()}
  if(SH&&t.id==="kcalIn"){const v=parseInt(t.value,10);SH.draft.kcal=isNaN(v)?null:v;sheetLive()}
});
document.addEventListener("submit",e=>{
  const f=e.target;e.preventDefault();
  if(f.id==="burnForm"){const k=parseInt($("#burnKcal").value,10);if(!(k>0))return;
    (S.burn[UI.sel]=S.burn[UI.sel]||[]).push({kcal:k,label:$("#burnLabel").value.trim()});save();render();toast(`+${k} kcal hozzáadva`);return}
  if(f.id==="profForm"){const sex=(f.querySelector('input[name=sex]:checked')||{}).value,act=parseFloat((f.querySelector('input[name=act]:checked')||{}).value||"1.2");
    const age=+$("#pAge").value,height=+$("#pHeight").value,weight=parseFloat(String($("#pWeight").value).replace(",","."));
    if(!sex||!age||!height||!weight)return;
    S.profile={sex,age,height,weight,act};save();render();toast("Adatok mentve");return}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!$("#sheet").hidden)closeSheet();
  if(e.key==="Enter"&&SH&&(e.target.dataset.amt||e.target.id==="kcalIn")&&dirty()){e.preventDefault();$("#saveBtn").click()}
});
render();
</script>
